# Development builds (your app + dev tools) for every target, built in the cloud.
# Run: npx eas-cli@latest workflow:run .eas/workflows/create-development-builds.yml
# iOS device builds need a paid Apple Developer account and registered devices (eas device:create).

name: Create development builds

jobs:
  android_development_build:
    name: Android (APK)
    type: build
    params:
      platform: android
      profile: development

  ios_device_development_build:
    name: iOS device
    type: build
    params:
      platform: ios
      profile: development

  ios_simulator_development_build:
    name: iOS Simulator
    type: build
    params:
      platform: ios
      profile: development-simulator
