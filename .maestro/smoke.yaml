# Smoke test: the app launches, both tabs render, and a setting can be changed.
# Run with `npm run e2e` (see scripts/e2e.mjs). Docs: https://docs.maestro.dev
appId: ${APP_ID}
name: Smoke
---
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible: 'Start building'
    timeout: 60000
- takeScreenshot: home

- tapOn: 'Settings'
- assertVisible: 'Version'
- tapOn: 'Dark'
- assertVisible: 'Variant'
- takeScreenshot: settings-dark

# Leave the app as we found it.
- tapOn: 'System'
